<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方塊學園 三上數學</title>
<meta name="theme-color" content="#141a2b">
<meta name="description" content="方塊學園：國小三年級上學期數學的方塊世界冒險，答對題目蒐集方塊、打魔王、蓋自己的家。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%238a5a33'/%3E%3Crect width='16' height='6' fill='%2358b947'/%3E%3Crect y='6' width='4' height='2' fill='%2358b947'/%3E%3Crect x='7' y='6' width='3' height='3' fill='%2358b947'/%3E%3Crect x='13' y='6' width='3' height='2' fill='%2358b947'/%3E%3Crect x='3' y='10' width='2' height='2' fill='%236b4423'/%3E%3Crect x='10' y='12' width='3' height='2' fill='%236b4423'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;text=%E6%96%B9%E5%A1%8A%E5%AD%B8%E5%9C%92&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* ===== 方塊學園 視覺系統：深色導航（抬頭列、底部工具列、地圖面板）＋ 淺色學習卡片（題目、說明、獎勵） ===== */
  :root{
    --ink:#141a2b; --ink2:#222b45; --ink3:#3a4668; --glass:rgba(20,26,43,.84);
    --paper:#fffaf0; --paper2:#f6ecd8; --line:#dccfb2; --text:#27304a; --mute:#6b7389;
    --go:#ff8a1f; --sky:#3b8cff; --leaf:#46b94a; --sun:#ffd23f; --ok:#2fae4e; --bad:#e5484d;
    --r:10px; --hud-h:58px;
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --display:"Dela Gothic One","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d1322;font-family:var(--font);color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%}
  #world{position:fixed;inset:0;display:block}
  /* 像素圖示：彩色的由貼圖集產生（.ico、.mat），單色的由點陣遮罩產生（.ic） */
  .ico,.mat{display:inline-block;width:22px;height:22px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;vertical-align:-5px;margin-right:4px;flex:none}
  .mat{width:18px;height:18px;vertical-align:-3px;margin-right:2px}
  .stone{background-image:var(--ico-stone)} .glass{background-image:var(--ico-glass)} .wood{background-image:var(--ico-wood)} .shard{background-image:var(--ico-shard)} .pick{background-image:var(--ico-pick)} .craft{background-image:var(--ico-craft)}
  .fox{background-image:var(--ico-fox)} .bow{background-image:var(--ico-bow)} .square{background-image:var(--ico-square)} .paper{background-image:var(--ico-paper)}
  .heart{background-image:var(--ico-heart)} .heart0{background-image:var(--ico-heart0)} .chest{background-image:var(--ico-chest)} .map{background-image:var(--ico-map)} .star{background-image:var(--ico-star)} .face{background-image:var(--ico-face)}
  .ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.32em;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat;flex:none}
  .ic.r{margin:0 0 0 .32em}
  .todo{display:inline-block;width:.8em;height:.8em;border:2px solid currentColor;border-radius:3px;opacity:.55;vertical-align:-.05em;margin-right:.2em}
  kbd{display:inline-block;min-width:1.7em;padding:1px 6px 3px;margin:0 2px;font:700 .85em var(--font);text-align:center;color:var(--text);background:#fff;border:2px solid var(--ink);border-radius:6px;box-shadow:0 2px 0 var(--ink)}
  /* 按鈕：厚邊框加下緣陰影，按下去會沉 */
  button{font:700 16px/1.2 var(--font);color:#fff;background:var(--b,#7c88a6);border:3px solid var(--ink);border-radius:var(--r);padding:10px 16px 13px;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.28);text-shadow:0 1px 0 rgba(0,0,0,.28);transition:transform .06s,filter .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.2)}
  button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  button.primary{--b:var(--go)} button.blue{--b:var(--sky)} button.green{--b:var(--leaf)} button.danger{--b:var(--bad)}
  button.plain{--b:#efe6d2;color:var(--text);text-shadow:none}
  button.ghost{--b:transparent;color:var(--mute);text-shadow:none;box-shadow:none;border-color:var(--line)}
  button:disabled{--b:#59617a;color:#a9b0c6;cursor:not-allowed;text-shadow:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
  button:disabled:hover{filter:none} button:disabled:active{transform:none}
  /* 抬頭顯示 */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:10px 12px;align-items:center;pointer-events:none;z-index:5}
  .chip{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 12px;background:var(--glass);border:2px solid var(--ink);border-radius:var(--r);color:#fff;font-weight:800;font-size:16px;pointer-events:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 8px rgba(0,0,0,.25);white-space:nowrap}
  .chip .ico{margin:0;vertical-align:0}
  .chip small{font-weight:500;opacity:.7;font-size:12px}
  #hearts{gap:2px;padding:0 9px} #hearts .ico{width:24px;height:24px}
  .chip.res{gap:0;padding:0 4px} .chip.res>span{display:inline-flex;align-items:center;gap:5px;padding:0 9px} .chip.res>span+span{border-left:2px solid rgba(255,255,255,.14)}
  .chip.gold{color:var(--sun)}
  #gear.none,#treasureChip.none{display:none} #gear .ico{margin:0 1px}
  .hud-sp{flex:1} .hud-break{display:none}
  .iconbtn{width:40px;height:38px;padding:0 0 3px;display:inline-flex;align-items:center;justify-content:center;--b:var(--ink2);font-size:18px;pointer-events:auto;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.16)}
  .iconbtn .ic{margin:0} .iconbtn.off .ic{opacity:.35} .iconbtn.off{position:relative} .iconbtn.off::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;margin-top:-3px;background:var(--bad);transform:rotate(-38deg);border-radius:2px}
  /* 底部工具列（營地、單元場景共用） */
  #menu,#sceneMenu{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:var(--glass);border:3px solid var(--ink);border-radius:16px;z-index:5;max-width:calc(100vw - 16px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #sceneMenu{display:none}
  .dock{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:94px;padding:8px 8px 11px;font-size:14px;line-height:1.15;white-space:nowrap}
  .dock .ico{width:28px;height:28px;margin:0} .dock>.ic{width:26px;height:26px;margin:0}
  .dock small{font-size:10.5px;font-weight:500;opacity:.92;margin-top:-1px}
  .dock.locked{--b:#59617a;color:#cfd5e6} .dock.locked .ico{filter:grayscale(1) opacity(.6)}
  .dock .badge{position:absolute;top:-9px;right:-7px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--ink);border:2px solid var(--sun);border-radius:50%;color:var(--sun);font-size:12px} .dock .badge .ic{margin:0;width:11px;height:11px} .dock .badge .ico{width:14px;height:14px;margin:0}
  .dnum{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);border-radius:8px;font-size:17px;font-weight:900} .dnum .ic{margin:0;width:16px;height:16px} .dnum .ico{margin:0}
  body.inscene #menu{display:none} body.inscene #sceneMenu{display:flex}
  /* 學習卡片 */
  #modal{position:fixed;inset:0;background:rgba(9,13,26,.66);display:none;align-items:center;justify-content:center;z-index:10;padding:14px 14px 22px}
  #modal.show{display:flex}
  .card{position:relative;background:var(--paper);color:var(--text);border:3px solid var(--ink);border-radius:16px;width:min(720px,100%);max-height:calc(100vh - 44px);max-height:calc(100dvh - 44px);overflow:auto;padding:0 20px 18px;box-shadow:0 8px 0 var(--ink),0 26px 60px rgba(0,0,0,.5);animation:cardIn .22s cubic-bezier(.2,1.3,.4,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .card h2{margin:0 -20px 14px;padding:13px 20px 14px;background:var(--ink2);color:#fff;font-size:21px;font-weight:900;display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:2}
  .card h2 .ico{width:26px;height:26px;margin:0;vertical-align:0}
  .card h2>span{font-size:13px;font-weight:500;color:#b7c1dc;margin:0}
  .card h2.win{background:linear-gradient(180deg,#ffb53a,#ff8a1f);justify-content:center;text-align:center;font-size:25px;padding:20px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .card h2.lose{background:linear-gradient(180deg,#6d7895,#4b5674);justify-content:center}
  .pips{display:flex;gap:5px;margin-left:auto} .pips i{width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.2);border:2px solid rgba(0,0,0,.35)} .pips i.done{background:var(--leaf)} .pips i.cur{background:var(--sun);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.25)}}
  .stem{font-size:20px;line-height:1.6;margin:8px 0 12px;font-weight:500} .stem b{font-weight:800} .stem.center{text-align:center}
  canvas.fig{display:block;background:#fff;border:3px solid var(--ink);border-radius:12px;margin:6px auto 14px;max-width:100%}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opts button{--b:#fff;color:var(--text);text-shadow:none;font-size:20px;font-weight:800;padding:14px 10px 17px;box-shadow:inset 0 -5px 0 var(--line)}
  .opts button:hover{--b:#fff6d6;filter:none} .opts button.sel{--b:#d6e7ff}
  .opts button.ok{--b:var(--leaf);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)} .opts button.bad{--b:var(--bad);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .inrow label{font-weight:700;font-size:19px}
  .inrow input,.ni,.vd{font-family:inherit;font-weight:800;color:var(--text);text-align:center;background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:inset 0 3px 0 rgba(20,26,43,.08);outline:none}
  .inrow input{width:96px;font-size:22px;padding:8px 6px;margin:0 6px} .ni{font-size:22px;padding:6px;margin:0 4px}
  .inrow input:focus,.ni:focus,.vd:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(59,140,255,.25)}
  .inrow input.ok,.ni.ok,.vd.ok{background:#c9f2cf;border-color:var(--ok)} .inrow input.bad,.ni.bad,.vd.bad{background:#ffd3d3;border-color:var(--bad)}
  .vgrid{display:grid;justify-content:center;font:bold 32px/1.5 monospace;text-align:center;margin:10px 0}
  .vgrid .vline{border-top:3px solid var(--ink);height:6px}
  .vd{width:44px;font:bold 28px monospace;padding:2px 0;margin:2px 3px;border-radius:8px}
  .eq{font-size:21px;font-weight:700;margin:8px 0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .eq.total{border-top:3px dashed var(--line);padding-top:10px}
  .web{background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 14px;margin:6px 0}
  .tools{justify-content:center}
  .ktxt{font-size:20px;min-width:96px;text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .row.center{justify-content:center}
  .msg{position:relative;border:3px solid;border-radius:12px;padding:10px 14px 10px 44px;margin-top:12px;font-size:16.5px;line-height:1.55}
  .msg::before{content:"";position:absolute;left:12px;top:11px;width:22px;height:22px;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
  .msg.hint{background:#fff3c4;border-color:#e3b93a;color:#5b4500} .msg.hint::before{-webkit-mask-image:var(--ic-bulb);mask-image:var(--ic-bulb);background:#c98f00}
  .msg.ok{background:#dff6e2;border-color:var(--ok);color:#14532d} .msg.ok::before{-webkit-mask-image:var(--ic-check);mask-image:var(--ic-check);background:var(--ok)}
  .msg.bad{background:#ffe3e3;border-color:var(--bad);color:#7a1c1f} .msg.bad::before{-webkit-mask-image:var(--ic-cross);mask-image:var(--ic-cross);background:var(--bad)}
  .progress{font-size:14px;color:var(--mute)}
  .recipe{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
  .recipe>div{flex:1} .recipe .name{font-weight:800;font-size:18px} .recipe .need{font-size:14.5px;color:var(--mute);line-height:1.6;margin-top:2px}
  .recipe .owned{display:inline-flex;align-items:center;color:var(--ok);font-weight:700;font-size:14px;margin-left:6px}
  .recipe button{flex:none;min-width:92px}
  .note{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.6}
  /* 獎勵與慶祝 */
  .loot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px}
  .loot-i{min-width:78px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 8px 8px;text-align:center;box-shadow:0 4px 0 var(--line);animation:lootIn .45s cubic-bezier(.2,1.5,.4,1) both}
  .loot-i .ico{display:block;width:36px;height:36px;margin:0 auto 4px} .loot-i b{display:block;font-size:20px;font-weight:900;color:#d9650a} .loot-i small{font-size:12px;color:var(--mute)}
  .loot-i.gold{background:#fff6cf;border-color:#c98f00}
  @keyframes lootIn{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:11} .confetti i{position:absolute;top:-16px;width:10px;height:10px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
  /* 場景內的浮動面板 */
  .float{background:var(--glass);border:3px solid var(--ink);border-radius:14px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #aim,#mapPanel,#taskPanel{position:fixed;left:14px;bottom:14px;display:none;z-index:6;padding:10px}
  #aim.show,#mapPanel.show,#taskPanel.show{display:block}
  #aim.show ~ #menu, #mapPanel.show ~ #menu{display:none}
  #taskPanel{width:min(440px,calc(100vw - 16px))} #modal.show ~ #taskPanel{display:none}
  #mapCv{display:block;border:3px solid var(--ink);border-radius:10px;background:#d7c190;image-rendering:pixelated}
  #mapRow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;font-weight:700}
  #mapRow span{width:100%} #mapRow button{padding:8px 14px 11px}
  #aimCv{display:block;border:3px solid var(--ink);border-radius:10px;background:#fff;touch-action:none;cursor:grab;image-rendering:pixelated}
  #aimRow{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:700}
  #aimRow input{flex:1;accent-color:var(--go)}
  #prompt{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);display:none;z-index:6;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:8px 20px 9px;font-weight:800;font-size:17px;cursor:pointer;text-align:center;box-shadow:0 5px 0 var(--ink),0 10px 20px rgba(0,0,0,.3);animation:bob 1.4s ease-in-out infinite}
  #prompt.show{display:block}
  #prompt small{display:block;font-weight:500;font-size:12.5px;opacity:.8}
  @keyframes bob{50%{transform:translate(-50%,-5px)}}
  #joy{position:fixed;left:18px;bottom:112px;width:132px;height:132px;border-radius:50%;background:rgba(20,26,43,.42);border:3px solid rgba(255,255,255,.6);display:none;z-index:6;touch-action:none}
  #joy.show{display:block}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.16);transform:translate(-50%,-50%);pointer-events:none}
  #modal.show ~ #prompt, #aim.show ~ #prompt, #mapPanel.show ~ #prompt, #modal.show ~ #joy, #aim.show ~ #joy, #mapPanel.show ~ #joy{display:none}
  body.nojoy #joy{display:none}
  #qbar{position:fixed;top:calc(var(--hud-h) + 2px);left:50%;transform:translateX(-50%);width:min(660px,calc(100vw - 16px));padding:10px 14px 12px;z-index:6;display:none}
  #qbar.show{display:block}
  #qmeta{font-size:13px;color:var(--sun);font-weight:700;margin:0 84px 3px 0;line-height:1.4}
  #qtext{font-size:21px;font-weight:800;line-height:1.45}
  #qtext .ic{color:var(--sun)}
  #qfig{display:none;width:220px;height:143px;background:#fff;border:3px solid var(--ink);border-radius:10px;margin:8px auto 0}
  #qbar .msg{margin-top:8px;padding:7px 10px 7px 40px;font-size:15px} #qbar .msg::before{top:8px;width:20px;height:20px}
  #qQuit{position:absolute;right:8px;top:8px;padding:4px 10px 6px;font-size:12px;--b:rgba(255,255,255,.14);border-width:2px;box-shadow:none;color:#dfe5f5}
  #qbar.show ~ #sceneMenu, #modal.show ~ #sceneMenu{display:none}
  #speech{position:fixed;top:calc(var(--hud-h) + 4px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100vw - 16px));padding:10px 18px 12px;font-size:18px;font-weight:800;display:none;z-index:6;text-align:center}
  #speech.show{display:block}
  #speech small{display:block;font-weight:500;font-size:14px;color:#c6cfe6;margin-top:3px;line-height:1.5}
  .toast{position:fixed;top:calc(var(--hud-h) + 70px);left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:9px 18px 10px;border:3px solid var(--ink);border-radius:999px;font-weight:800;z-index:12;animation:pop 1.6s forwards;pointer-events:none;box-shadow:0 5px 0 var(--ink);white-space:nowrap}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
  body.busy #menu, body.busy #sceneMenu, body.busy #prompt{display:none}
  .fuse{height:14px;background:rgba(0,0,0,.35);border:2px solid var(--ink);border-radius:7px;margin:6px 0;overflow:hidden}
  #fuseBar{height:100%;background:linear-gradient(90deg,#3fbf5f,#e8c547,#e04848);width:100%;transition:width .1s linear}
  /* 偷襲作答與蓋房子調色盤 */
  .amb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.amb{--b:#fff;color:var(--text);text-shadow:none;font-size:19px;font-weight:800;padding:12px 8px 15px;text-align:left;box-shadow:inset 0 -5px 0 var(--line);display:flex;align-items:center;gap:8px}
  button.amb .n{flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--sun);color:var(--ink);font-size:14px;width:24px;height:24px;border-radius:6px;border:2px solid var(--ink)}
  button.amb.right{--b:var(--leaf);color:#fff} button.amb:disabled{color:var(--text);--b:#e9e3d6} button.amb.right:disabled{--b:var(--leaf);color:#fff}
  .pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pal-b{--b:#efe6d2;color:var(--text);text-shadow:none;display:flex;flex-direction:column;align-items:center;padding:7px 2px 9px;font-size:14px;line-height:1.2;box-shadow:inset 0 -4px 0 var(--line)}
  .pal-b i{display:block;width:24px;height:24px;border:2px solid var(--ink);border-radius:5px;margin-bottom:3px} .pal-b small{font-size:10px;font-weight:500;color:var(--mute)}

function drawAngle(ctx, x, y, deg, rot, L1, L2, color, label, mark) {
  const a0 = rot * Math.PI / 180, a1 = (rot - deg) * Math.PI / 180;
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a0) * L1, y + Math.sin(a0) * L1); ctx.lineTo(x, y); ctx.lineTo(x + Math.cos(a1) * L2, y + Math.sin(a1) * L2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fillStyle = '#222'; ctx.fill();
  if (mark === 'arc') { ctx.beginPath(); ctx.arc(x, y, 22, a1, a0); ctx.lineWidth = 2; ctx.stroke(); }
  if (mark === 'right') { const s = 16; const p = (ang, r) => [x + Math.cos(ang) * r, y + Math.sin(ang) * r]; const [ax, ay] = p(a0, s), [bx, by] = p(a1, s); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + (bx - x), ay + (by - y)); ctx.lineTo(bx, by); ctx.lineWidth = 2; ctx.stroke(); }
  if (label) { const am = (a0 + a1) / 2; ctx.fillStyle = color; ctx.font = 'bold 18px sans-serif'; ctx.fillText(label, x + Math.cos(am) * 34 - 8, y + Math.sin(am) * 34 + 6); }
}
function drawPolygon(ctx, pts, fill, curvedIdx) {

  for (let i = 1; i <= pts.length; i++) {

    if (curvedIdx.includes(i - 1)) { const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, cx = (mx + (q[1] - p[1]) * .5), cy = (my + (p[0] - q[0]) * .5); ctx.quadraticCurveTo(cx, cy, p[0], p[1]); }
    else ctx.lineTo(p[0], p[1]);

// ============================================================
//  單元守衛的專屬玩法：每個單元一種操作，贏三回合打倒守衛
// ============================================================
const BOSS_DESC = { 1: '數線跳格：在數線上點出史萊姆躲的位置', 2: '拼回答案：直式計算從個位一格一格填數字', 3: '鋸木條：把木條鋸成剛好的長度', 4: '拆蛛網：把乘法拆開來算，再合起來', 6: '蓋房子：點方格蓋出指定面積的房子', 7: '裝餅乾：每袋裝一樣多，自己判斷什麼時候該停', 8: '倒水：用杯子倒出剛好的容量', 9: '切蛋糕：把蛋糕平分，給出指定的分數' };

const FIG = '<canvas class="fig" id="fig" width="400" height="260"></canvas>';

function bossResolve(ok, exp) {

  if (ok) { sfx.hit(); UB.hp--; if (UB.onHit) UB.onHit(); else world.unitBossHit(); $('#msg').innerHTML = `<div class="msg ok">${exp} ${UB.asStage ? '完成一回合！' : UB.title ? UB.title + '受傷了！' : '守衛受傷了！'}</div><div class="row"><button class="primary" id="n">繼續<i class="ic ic-next r"></i></button></div>`; }

function dragOn(cv, fn) { cv.style.touchAction = 'none'; let down = false; cv.addEventListener('pointerdown', e => { if (bossDone) return; down = true; fn(e, true); }); cv.addEventListener('pointermove', e => { if (down && !bossDone) fn(e, false); }); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => cv.addEventListener(t, () => down = false)); }

// ---------- 第 1 單元 數線跳格 ----------
BOSS_GAMES[1] = () => {
  const step = pick([10, 100, 1000]), start = step === 10 ? rnd(1, 8) * 1000 + rnd(0, 8) * 100 : step === 100 ? rnd(0, 8) * 1000 : 0, half = UB.round >= 3;
  let k; do { k = half ? rnd(1, 19) : rnd(1, 9) * 2; } while (k === 10);
  const target = start + k * step / 2, x0 = 30, x1 = 370, y = 160, dx = (x1 - x0) / 20; let sel = null;
  bossShell(`數字史萊姆躲在數線上的 <b>${target}</b>，點出牠躲在哪裡！`, FIG, '先看標了數字的兩個刻度差多少、中間有幾大格，算出一大格是多少；每一大格又平分成兩小格。', '<button class="plain" id="lBtn">◀ 左移一小格</button><button class="plain" id="rBtn">右移一小格<i class="ic ic-next r"></i></button>');

    if (sel === null) { ctx.fillStyle = '#888'; ctx.font = '15px sans-serif'; ctx.fillText('點數線上的刻度', 145, 70); return; }
    const x = x0 + sel * dx; ctx.fillStyle = '#e8702a'; ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x - 9, y - 32); ctx.lineTo(x + 9, y - 32); ctx.fill();
    ctx.fillStyle = '#d94f4f'; ctx.fillRect(x - 17, y - 70, 34, 32); ctx.fillStyle = '#fff'; ctx.fillRect(x - 10, y - 62, 7, 7); ctx.fillRect(x + 3, y - 62, 7, 7); ctx.fillStyle = '#222'; ctx.fillRect(x - 8, y - 60, 4, 4); ctx.fillRect(x + 5, y - 60, 4, 4);
  }
  dragOn(cv, e => { const [x] = cvPoint(cv, e); sel = Math.max(0, Math.min(20, Math.round((x - x0) / dx))); draw(); });
  $('#lBtn').onclick = () => { sel = sel === null ? 10 : Math.max(0, sel - 1); draw(); }; $('#rBtn').onclick = () => { sel = sel === null ? 10 : Math.min(20, sel + 1); draw(); };

  window.__boss = { solve() { sel = k; draw(); }, fail() { sel = k === 1 ? 2 : k - 1; draw(); } };
};

// ---------- 第 2 單元 拼回答案（直式一格一格填） ----------
BOSS_GAMES[2] = () => {
  const add = Math.random() < .5; let a, b;
  if (add) { a = rnd(1000, 7999); b = rnd(100, Math.min(2999, 9999 - a)); } else { a = UB.round >= 3 ? rnd(2, 9) * 1000 + rnd(0, 9) * pick([1, 10]) : rnd(2000, 9999); b = rnd(100, a - 100); }
  const op = add ? '＋' : '－', ans = add ? a + b : a - b, C = Math.max(String(a).length, String(ans).length), pad = n => String(n).padStart(C, ' ').split(''), cell = c => `<div>${c === ' ' ? '' : c}</div>`;
  const body = `<div class="vgrid" style="grid-template-columns:repeat(${C + 1},48px)"><div></div>${pad(a).map(cell).join('')}<div>${op}</div>${pad(b).map(cell).join('')}<div class="vline" style="grid-column:1 / span ${C + 1}"></div><div></div>${Array.from({ length: C }, (_, i) => `<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="vd" data-i="${i}" autocomplete="off">`).join('')}</div>`;
  bossShell(`算盤骷髏把答案打碎了！從個位開始，一格填一個數字，把 ${a}${op}${b} 的答案拼回去。`, body, add ? '從個位開始加，滿十就向左邊一位進 1。' : '從個位開始減，不夠減就向左邊一位借 1 當 10；左邊是 0 就要再往左借。');
  const ins = [...$('#card').querySelectorAll('.vd')], digits = String(ans).padStart(C, '0').split(''), lead = digits.findIndex(d => d !== '0');
  ins.forEach((el, i) => el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); if (el.value && i > 0) ins[i - 1].focus(); }));
  if (!TOUCH) ins[C - 1].focus();
  $('#okBtn').onclick = () => {
    if (ins.every(e => e.value === '')) { toast('先填數字', '#d64545'); return; }
    let ok = true; ins.forEach((e, i) => { const got = e.value === '' && i < lead ? '0' : e.value, good = got === digits[i]; e.classList.add(good ? 'ok' : 'bad'); if (!good) ok = false; });
    bossResolve(ok, ok ? `${a}${op}${b}＝${ans}。` : `正確答案是 ${ans}，紅色的格子算錯了。`);
  };
  window.__boss = { solve() { ins.forEach((e, i) => e.value = i < lead ? '' : digits[i]); }, fail() { ins.forEach((e, i) => e.value = i < lead ? '' : String((+digits[i] + 1) % 10)); } };
};

// ---------- 第 3 單元 鋸木條 ----------
BOSS_GAMES[3] = () => {
  let T; do { T = rnd(15, 95); } while (T % 10 === 0); const cm = Math.floor(T / 10), mm = T % 10, r = UB.round;
  const label = r === 1 ? `${cm} 公分 ${mm} 毫米` : r === 2 ? `${T} 毫米` : `比 ${cm + 1} 公分短 ${10 - mm} 毫米`;
  const x0 = 20, ppm = 3.6, y = 175; let sel = Math.abs(T - 30) > 8 ? 30 : 70;
  bossShell(`長尺殭屍要一根 <b>${label}</b> 的木條。拖曳鋸子（或用按鈕微調），把木條鋸到剛好的長度！`, FIG, r === 3 ? `先找到 ${cm + 1} 公分，再往左退 ${10 - mm} 小格。` : r === 2 ? `${T} 毫米就是 ${cm} 公分 ${mm} 毫米：先找到 ${cm} 公分，再往右數 ${mm} 小格。` : `先找到 ${cm} 公分，再往右數 ${mm} 小格，1 小格是 1 毫米。`, '<button class="plain" id="mBtn">－1 毫米</button><button class="plain" id="pBtn">＋1 毫米</button>');
  const cv = $('#fig'), ctx = cv.getContext('2d');
  function draw() {
    clearFig(ctx); const xe = x0 + 100 * ppm, xc = x0 + sel * ppm;
    ctx.fillStyle = '#c99a5b'; ctx.fillRect(x0, y - 46, xc - x0, 36); ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 2; ctx.strokeRect(x0, y - 46, xc - x0, 36);
    ctx.strokeStyle = 'rgba(110,70,30,.45)'; ctx.lineWidth = 1; for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x0, y - 46 + i * 9); ctx.lineTo(xc, y - 46 + i * 9 + (i % 2 ? 2 : -2)); ctx.stroke(); }
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#b9a07a'; ctx.strokeRect(xc, y - 46, xe - xc, 36); ctx.setLineDash([]);
    ctx.fillStyle = '#f4e4b0'; ctx.fillRect(x0 - 6, y, 372, 60); ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    for (let m = 0; m <= 100; m++) { const x = x0 + m * ppm, h = m % 10 === 0 ? 26 : m % 5 === 0 ? 17 : 10; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.stroke(); if (m % 10 === 0) { ctx.fillStyle = '#222'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(m / 10), x, y + 44); } }
    ctx.textAlign = 'left'; ctx.fillStyle = '#222'; ctx.font = '12px sans-serif'; ctx.fillText('公分(cm)', x0 + 310, y + 57);

Object.entries(FAST).forEach(([id, [k, x, z]]) => $('#' + id).onclick = () => { world.teleport(x, z); SPOT_ACTION[k](); });
$('#musicBtn').onclick = () => music.toggle(); music.ui();
$('#modal').addEventListener('click', e => { if (e.target === $('#modal') && ['camp', 'practice', 'craft'].includes(S.mode) && !document.body.classList.contains('inmap')) { closeModal(); S.mode = 'camp'; } });
hud();
// ============================================================
//  首頁：標題、繼續冒險、九個單元進度；操作說明
// ============================================================
const isNewPlayer = () => !S.wood && !S.shard && !S.gear.bow && !Object.values(S.units || {}).some(x => x.sets || x.star || (x.stages || []).some(Boolean));
function showHelp(cb) {
  openModal(`<h2><i class="ico face"></i>怎麼玩 <span>方塊學園 ・ 三上數學冒險</span></h2>
    <div class="stem">九個單元是九座島。每座島有三關和一個魔王，答對題目就能蒐集方塊，回營地蓋自己的家。</div>
    <div class="msg ok">走動：電腦用 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵（中文輸入法開著也可以），也能用滑鼠拖左下角的搖桿；手機用搖桿。走到祭壇、工作臺或牌子旁邊，按 <kbd>E</kbd> 或點黃色提示就能互動。</div>
    <div class="help-grid">
      <div class="help-c"><b><i class="ico pick"></i>闖三關</b>撿方塊：走去撞正確答案。守衛戰：點正確答案的殭屍射箭。工匠試煉：動手算出答案。三關都過才能打魔王。</div>
      <div class="help-c"><b><i class="ico heart"></i>小心偷襲</b>走路時蜘蛛和殭屍會衝過來，15 秒內答對才能脫身，答錯會少一顆心。</div>
      <div class="help-c"><b><i class="ico wood"></i>蓋我的家</b>過關和打跑怪物會拿到木材、石頭、玻璃，回營地南邊的建地蓋房子。</div>
    </div>
    <div class="note">每一題都是新的變化題。提示永遠免費，答錯不會扣材料。想換單元就按「群島地圖」。</div>
    <div class="row center"><button class="primary" id="go">開始冒險</button></div>`);
  $('#go').onclick = () => { closeModal(); beep(523, .1); cb && cb(); };
}
function confirmReset() {
  openModal(`<h2>重新開始</h2><div class="stem">確定要刪掉所有進度嗎？星星、材料、裝備和蓋好的房子都會不見，而且救不回來。</div><div class="row"><button class="plain" id="resetNo">取消</button><button class="danger" id="resetYes">全部刪除</button></div>`);
  $('#resetNo').onclick = closeModal; $('#resetYes').onclick = () => { try { localStorage.removeItem('u5game'); } catch (e) {} location.reload(); };
}
function openSettings() {
  if (!['camp', 'scene', 'map'].includes(S.mode)) { toast('關卡進行中，先完成或放棄這一關', '#e5484d'); return; }
  openModal(`<h2><i class="ic ic-gear"></i>設定</h2><div class="set-list">
    <button class="set-row" id="setMusic"><i class="ic ic-note"></i>背景音樂<b>${music.on ? '開' : '關'}</b></button>
    <button class="set-row" id="setHelp"><i class="ic ic-help"></i>怎麼玩</button>
    ${S.mode !== 'map' ? '<button class="set-row" id="setMap"><i class="ic ic-flag"></i>回群島地圖</button>' : ''}
    <button class="set-row del" id="setReset"><i class="ic ic-cross"></i>刪除進度，重新開始</button></div>
    <div class="about">方塊學園 ・ 三上數學冒險　版本 1.0<br>對應國小三年級上學期數學九個單元，題目都是自動產生的變化題。</div>
    <div class="row center"><button class="plain" id="setClose">關閉</button></div>`);
  $('#setMusic').onclick = () => { music.toggle(); openSettings(); }; $('#setHelp').onclick = () => showHelp(); const m = $('#setMap'); if (m) m.onclick = openWorldMap; $('#setReset').onclick = confirmReset; $('#setClose').onclick = closeModal;
}
$('#mapHelp').onclick = () => showHelp(); $('#setBtn').onclick = openSettings;
setTimeout(() => { const sp = $('#splash'); if (sp) { sp.classList.add('hide'); setTimeout(() => sp.remove(), 600); } }, 1250);
// 一打開遊戲就是群島地圖大世界，在這裡選單元；第一次玩先看操作說明
openWorldMap(); if (isNewPlayer()) showHelp();
</script>
</body>
</html>
